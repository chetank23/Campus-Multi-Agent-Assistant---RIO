# ─── Gitleaks Configuration for RIO-MJP ───────────────────────────────
# Scans git history and repository sources for accidentally committed secrets.

title = "RIO-MJP Security & Secret Scanning"

[allowlist]
description = "Global allowlist for sample documentation, test mocks, and environment examples"
paths = [
    '''\.env\.example$''',
    '''frontend/\.env\.example$''',
    '''package-lock\.json$''',
    '''frontend/package-lock\.json$''',
    '''tests/conftest\.py$''',
    '''tests/database/test_database_safety\.py$''',
    '''tests/api/test_security_hardening\.py$''',
]
regexes = [
    '''sk-ant-api03-validlookingkeyforunitmocking''',
    '''nvapi-valid-test-key''',
    '''nvapi-real-key-example''',
    '''nvapi-abcdef1234567890''',
    '''rio-ci-only-signing-key-not-used-outside-ephemeral-tests-2026''',
    '''your-32-byte-random-secret-key-here''',
    '''your_nvidia_api_key_here''',
    '''yourpassword''',
]

[[rules]]
id = "nvidia-api-key"
description = "NVIDIA NIM / NGC API Key"
regex = '''nvapi-[A-Za-z0-9_-]{20,}'''
keywords = ["nvapi-"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-api[0-9]{2}-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API Key"
regex = '''sk-[A-Za-z0-9]{32,50}'''
keywords = ["sk-"]

[[rules]]
id = "jwt-secret-leak"
description = "Hardcoded JWT Secret Assignment"
regex = '''(?i)(jwt_secret|jwt_secret_key)\s*[:=]\s*["'][A-Za-z0-9_\-\.]{16,}["']'''

[[rules]]
id = "database-connection-string"
description = "PostgreSQL connection string with embedded password"
regex = '''postgres(?:ql)?(?:\+[a-z0-9]+)?://[^:@\s]+:(?!yourpassword|postgres|<)[^@\s]+@'''

[[rules]]
id = "private-key"
description = "Private Key File Header"
regex = '''-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'''
