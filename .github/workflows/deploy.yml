name: Release & Deployment Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment target environment (production or preview)'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  build-and-package:
    name: Build and Package Deployment Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Frontend Dependencies & Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Backend Dependencies & Validate
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall -q backend agents database

      - name: Package Standalone Backend Release
        run: |
          mkdir -p release-dist
          tar -czf release-dist/rio-backend-release.tar.gz \
            backend agents database alembic.ini requirements.txt netlify.toml

      - name: Generate Deployment Metadata Manifest
        run: |
          mkdir -p release-dist
          cat <<EOF > release-dist/deployment-manifest.json
          {
            "project": "RIO-MJP",
            "commit_sha": "${{ github.sha }}",
            "git_ref": "${{ github.ref }}",
            "build_timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "actor": "${{ github.actor }}",
            "frontend_target": "Netlify",
            "backend_target": "Render",
            "frontend_artifact": "frontend/dist",
            "backend_artifact": "rio-backend-release.tar.gz"
          }
          EOF
          cat release-dist/deployment-manifest.json

      - name: Upload Frontend Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-build
          path: frontend/dist/
          retention-days: 30

      - name: Upload Backend Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: backend-release-bundle
          path: release-dist/rio-backend-release.tar.gz
          retention-days: 30

      - name: Upload Deployment Manifest
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest
          path: release-dist/deployment-manifest.json
          retention-days: 30

  deploy-production:
    name: Production Deployment & Health Verification
    needs: [build-and-package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy_frontend.outputs.deploy_url || 'https://rio-mjp.netlify.app' }}
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event.inputs.target_env == 'production'
    steps:
      - uses: actions/checkout@v7

      - name: Download Frontend Production Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-production-build
          path: frontend/dist/

      - name: Download Deployment Manifest
        uses: actions/download-artifact@v4
        with:
          name: deployment-manifest
          path: release-dist/

      - name: Verify Deployment Credentials & Configuration
        id: check_creds
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE: ${{ secrets.NETLIFY_SITE_ID }}
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$NETLIFY_TOKEN" ] && [ -n "$NETLIFY_SITE" ]; then
            echo "has_netlify=true" >> "$GITHUB_OUTPUT"
            echo "Netlify credentials configured."
          else
            echo "has_netlify=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NETLIFY_AUTH_TOKEN and/or NETLIFY_SITE_ID secrets are not configured in GitHub repository. Standalone deployment bundle generated successfully."
          fi

          if [ -n "$RENDER_HOOK" ]; then
            echo "has_render=true" >> "$GITHUB_OUTPUT"
            echo "Render deploy hook configured."
          else
            echo "has_render=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RENDER_DEPLOY_HOOK_URL secret is not configured. Standalone backend artifact ready for deployment."
          fi

      - name: Deploy Frontend to Netlify Production
        id: deploy_frontend
        if: steps.check_creds.outputs.has_netlify == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx netlify-cli deploy --prod --dir=frontend/dist
          echo "deploy_url=https://rio-mjp.netlify.app" >> "$GITHUB_OUTPUT"

      - name: Trigger Backend Deployment on Render
        if: steps.check_creds.outputs.has_render == 'true'
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering backend deploy hook..."
          curl -s -X POST "$RENDER_HOOK"

      - name: Verify Live Deployment Health Check
        if: steps.check_creds.outputs.has_netlify == 'true'
        run: |
          echo "Running health check against production endpoint..."
          curl -sf "https://rio-mjp.netlify.app" > /dev/null && echo "Netlify SPA is healthy."

      - name: Provide Deployment Summary & Rollback Guidance
        run: |
          echo "=========================================================="
          echo "             RIO-MJP DEPLOYMENT SUMMARY                   "
          echo "=========================================================="
          echo "Commit SHA: ${{ github.sha }}"
          echo "Ref: ${{ github.ref }}"
          echo "Artifacts generated:"
          echo "  - frontend-production-build (Vite static assets)"
          echo "  - backend-release-bundle (Python standalone package)"
          echo "  - deployment-manifest (Audit trace)"
          echo ""
          echo "Rollback Guidance:"
          echo "  - Netlify: In Netlify Console -> Deploys, select previous deploy and click 'Publish deploy'."
          echo "  - Render: In Render Dashboard, roll back to prior successful commit or tag."
          echo "=========================================================="
